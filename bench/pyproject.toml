[project]
name = "traceaml-bench"
version = "0.1.0"
description = "TraceAML reproducible latency, capacity, and cost benchmark suite."
requires-python = ">=3.12"
dependencies = [
    "traceaml-api",
    "traceaml-graph",
    "lightgbm>=4.7",
    "numpy>=2.0",
    "duckdb>=1.0",
    "pyarrow>=17.0",
    "httpx>=0.27",
    "psutil>=6.0",
]

[project.scripts]
traceaml-bench = "bench.cli:main"

[tool.uv.sources]
traceaml-api = { path = "../services/api", editable = true }
traceaml-graph = { path = "../graph", editable = true }

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bench"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
