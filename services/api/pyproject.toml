[project]
name = "traceaml-api"
version = "0.1.0"
description = "TraceAML FastAPI service: contracts, replay orchestration, deterministic policy."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "pydantic-settings>=2.4",
    "falkordb>=1.0",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "pyarrow>=17.0",
    "traceaml-graph",
    "google-genai>=2.31.0",
    "mcp>=1.2,<2",
]

[tool.uv.sources]
traceaml-graph = { path = "../../graph", editable = true }

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
