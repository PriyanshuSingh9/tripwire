[project]
name = "traceaml-ml"
version = "0.1.0"
description = "TraceAML offline evaluation: data protocol, baselines, and benchmarks."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "polars>=1.0",
    "duckdb>=1.0",
    "pyarrow>=17.0",
    "scikit-learn>=1.5",
    "lightgbm>=4.0",
]

[project.scripts]
traceaml-profile-csv = "ml.profile_csv:main"
traceaml-inspect-hi-small = "ml.inspect_data:main"
traceaml-prepare-hi-small = "ml.prepare_data:main"
traceaml-build-features = "ml.features:main"
traceaml-train-baselines = "ml.baselines:main"
traceaml-daily-report = "ml.daily_report:main"
traceaml-publish-inference-scores = "ml.inference_scores:main"
traceaml-experiment = "ml.experiment:main"

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ml"]

[tool.ruff]
target-version = "py312"
line-length = 100
